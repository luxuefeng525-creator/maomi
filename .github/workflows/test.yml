name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # 任一条失败即整体可见：不让一个平台的红遮住另一个平台的结果
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 20/22/24：18 已 EOL，22 是当前 LTS，24 与本机实际运行时一致
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Registry check
        run: node scripts/index-skills.mjs --check
      - name: Skill gate
        run: node scripts/validate.mjs
      # 场景评测放在单测之前：原先单测一红就 skip 掉后面 29 个场景，
      # 等于一条失败遮蔽全部评测结果（0.22.0 之前 CI 连红 19 次正是这种盲区）。
      - name: Scenario eval
        run: node tests/eval.mjs
      - name: Unit checks
        run: node tests/run.mjs
      # 生成物漂移防线：registry/index 过期、忘提交，一律在这里现形（bash 在 windows-latest 上也有）
      - name: Worktree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::工作区不干净：生成物漂移或忘记提交（先跑 npm run registry:write 并提交）"
            git status --porcelain
            git diff
            exit 1
          fi
      # 覆盖率基线只在一个组合跑：它要重跑全部套件，跑 6 遍纯属浪费
      - name: Coverage baseline
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/coverage.mjs --min 40
