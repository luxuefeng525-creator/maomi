name: release

# 发布：推 v* tag 才触发。三道校验通过才 publish，避免「tag 与包版本不一致」这类
# 只能靠人工发现的错版（npm 上版本号不可回收，错了要么废弃要么跳版）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # 发布构建绝不使用缓存

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag($TAG) 与 package.json 版本($PKG) 不一致"
            exit 1
          fi

      - name: 校验 CHANGELOG 首条版本一致
        run: |
          PKG=$(node -p "require('./package.json').version")
          FIRST=$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "changelog=$FIRST pkg=$PKG"
          if [ "$FIRST" != "$PKG" ]; then
            echo "::error::CHANGELOG 首条($FIRST) 与 package.json($PKG) 不一致，先补变更记录"
            exit 1
          fi

      - name: 发布前自检（registry + 技能门禁 + 场景评测 + 单测）
        run: npm run prepublishOnly

      - name: npm publish（Trusted Publishing / OIDC，无需 token）
        # 发布走 npm Trusted Publishing：靠 id-token: write 换 OIDC 令牌，不再需要任何 secret。
        # 前置（一次性，在 npmjs.com 上做）：包 → Settings → Trusted Publisher → GitHub Actions，
        #   用户=luxuefeng525-creator，仓库=maomi，工作流文件名=release.yml（环境留空）。
        # 配置后须在 2 天内完成首次发布，否则该配置过期作废。
        # 备选（仍想用 token）：解开下面 env，且该 token 必须勾选「Bypass 2FA」+ 读写包权限，
        #   否则 registry 会以 403「You may not perform that action with these credentials」拒绝。
        run: npm publish --access public --provenance
