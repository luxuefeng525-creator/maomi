name: release

# 发布：推 v* tag 才触发。三道校验通过才 publish，避免「tag 与包版本不一致」这类
# 只能靠人工发现的错版（npm 上版本号不可回收，错了要么废弃要么跳版）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag($TAG) 与 package.json 版本($PKG) 不一致"
            exit 1
          fi

      - name: 校验 CHANGELOG 首条版本一致
        run: |
          PKG=$(node -p "require('./package.json').version")
          FIRST=$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "changelog=$FIRST pkg=$PKG"
          if [ "$FIRST" != "$PKG" ]; then
            echo "::error::CHANGELOG 首条($FIRST) 与 package.json($PKG) 不一致，先补变更记录"
            exit 1
          fi

      - name: 发布前自检（registry + 技能门禁 + 场景评测 + 单测）
        run: npm run prepublishOnly

      - name: npm publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
