<?xml version="1.0" encoding="UTF-8"?>
<!-- 本 skill 自建工艺/品牌图元库（原创，随 skill 一同以其许可提供） -->
<!-- 填补 FUXA 库未覆盖的水务/热泵场景图元与 LOGO。用法同 FUXA 库： -->
<!-- 复制所需 <symbol> 进目标 SVG <defs>，<use href="#sk-xxx" width height style="color:var(--状态色)"/>，currentColor 着色。 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- 热泵站 LOGO：机组外框 + 制冷循环十字 + 能量点 -->
  <symbol id="sk-logo-heatpump" viewBox="0 0 24 24">
    <rect x="3.6" y="6" width="16.8" height="12" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M7.2 12h9.6M12 8.4v7.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="12" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <!-- 水务 LOGO：水滴 + 内弧水面 -->
  <symbol id="sk-logo-water" viewBox="0 0 24 24">
    <path d="M12 2.4C7.2 8.4 4.8 12 4.8 15.6a7.2 7.2 0 0 0 14.4 0c0-3.6-2.4-7.2-7.2-13.2z" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M12 7.2c-2.4 3-3.6 5.4-3.6 7.2a3.6 3.6 0 0 0 7.2 0" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <!-- 地源井群：竖罐 + 水平地层线（源侧埋管） -->
  <symbol id="sk-ground-well" viewBox="0 0 24 24">
    <rect x="7" y="2.4" width="10" height="19.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M9 7.2h6M9 10.8h6M9 14.4h6M9 18h6" fill="none" stroke="currentColor" stroke-width="0.9"/>
  </symbol>

  <!-- 旋转叶轮（俯视三叶，用于泵/压缩机动画，配 .spin 类） -->
  <symbol id="sk-impeller" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M12 12V3.6M12 12l7.3 4.2M12 12l-7.3 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
  </symbol>

  <!-- 分集水器：横向集箱 + 支管接口 -->
  <symbol id="sk-manifold" viewBox="0 0 24 24">
    <rect x="2.4" y="9.6" width="19.2" height="4.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M6 9.6V5.4M12 9.6V5.4M18 9.6V5.4M6 14.4v4.2M12 14.4v4.2M18 14.4v4.2" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <!-- 高位水塔：支柱 + 顶部水箱 -->
  <symbol id="sk-water-tower" viewBox="0 0 24 24">
    <rect x="6" y="3" width="12" height="7.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M9 10.2v9.6M15 10.2v9.6M7.2 21.6h9.6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M7.5 6.6h9" fill="none" stroke="currentColor" stroke-width="0.9"/>
  </symbol>

  <!-- 仪表气泡（ISA-5.1 测点，上圆下方标牌） -->
  <symbol id="sk-instrument" viewBox="0 0 24 24">
    <circle cx="12" cy="8.4" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M6 8.4h12" fill="none" stroke="currentColor" stroke-width="0.9"/>
    <rect x="7.2" y="15.6" width="9.6" height="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
  </symbol>

</svg>
